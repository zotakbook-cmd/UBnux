<!DOCTYPE html>
<html lang="en-IN">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Forgot Password | UBnux</title>

  <meta
    name="description"
    content="Recover your UBnux business account password."
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >

  <style>

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: #f7f8fa;
    }

    .forgot-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 18px;
    }

    .forgot-card {
      width: 100%;
      max-width: 480px;
      padding: 40px;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 12px 45px rgba(0,0,0,.09);
    }

    .forgot-logo {
      width: 58px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
      border-radius: 16px;
      background: #111827;
      color: #fff;
      font-size: 25px;
      font-weight: 800;
    }

    .forgot-card h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 30px;
      color: #111827;
    }

    .forgot-description {
      margin: 0 auto 28px;
      max-width: 390px;
      text-align: center;
      color: #6b7280;
      line-height: 1.7;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    .form-group input {
      box-sizing: border-box;
      width: 100%;
      min-height: 49px;
      padding: 0 14px;
      border: 1px solid #d9dde3;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }

    .form-group input:focus {
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17,24,39,.07);
    }

    .submit-button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 11px;
      background: #111827;
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .submit-button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fef2f2;
      color: #991b1b;
    }

    .message.success {
      background: #f0fdf4;
      color: #166534;
    }

    .links {
      margin-top: 25px;
      padding-top: 22px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 14px;
      line-height: 2;
    }

    .links a {
      color: #111827;
      font-weight: 700;
      text-decoration: none;
    }

    .verification-section {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #eee;
    }

    .verification-section.show {
      display: block;
    }

    .password-section {
      display: none;
      margin-top: 25px;
    }

    .password-section.show {
      display: block;
    }

    .success-panel {
      display: none;
      text-align: center;
    }

    .success-panel.show {
      display: block;
    }

    .success-icon {
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      font-size: 28px;
    }

    @media (max-width: 550px) {

      .forgot-card {
        padding: 30px 22px;
      }

    }

  </style>

</head>

<body>

  <main class="forgot-page">

    <section class="forgot-card">

      <div class="forgot-logo">
        U
      </div>


      <div id="mainRecovery">

        <h1>
          Forgot Password?
        </h1>

        <p class="forgot-description">
          Enter the mobile number or email associated with your
          UBnux business account.
        </p>


        <div
          id="message"
          class="message"
          role="alert"
        ></div>


        <form
          id="requestForm"
          novalidate
        >

          <div class="form-group">

            <label for="identifier">
              Mobile Number / Email
            </label>

            <input
              id="identifier"
              type="text"
              placeholder="Enter registered mobile or email"
              autocomplete="username"
              required
            >

          </div>


          <button
            id="requestButton"
            class="submit-button"
            type="submit"
          >
            Send Verification Code
          </button>

        </form>


        <section
          id="verificationSection"
          class="verification-section"
        >

          <div class="form-group">

            <label for="otp">
              Verification Code
            </label>

            <input
              id="otp"
              type="text"
              inputmode="numeric"
              maxlength="8"
              placeholder="Enter verification code"
              autocomplete="one-time-code"
            >

          </div>


          <button
            id="verifyButton"
            class="submit-button"
            type="button"
          >
            Verify Code
          </button>

        </section>


        <section
          id="passwordSection"
          class="password-section"
        >

          <div class="form-group">

            <label for="newPassword">
              New Password
            </label>

            <input
              id="newPassword"
              type="password"
              minlength="6"
              placeholder="Minimum 6 characters"
              autocomplete="new-password"
            >

          </div>


          <div class="form-group">

            <label for="confirmPassword">
              Confirm New Password
            </label>

            <input
              id="confirmPassword"
              type="password"
              minlength="6"
              placeholder="Re-enter new password"
              autocomplete="new-password"
            >

          </div>


          <button
            id="resetButton"
            class="submit-button"
            type="button"
          >
            Reset Password
          </button>

        </section>


        <div class="links">

          <a href="business-login.html">
            ← Back to Business Login
          </a>

          <br>

          <a href="index.html">
            Back to UBnux

          </a>

        </div>

      </div>


      <div
        id="successPanel"
        class="success-panel"
      >

        <div class="success-icon">
          ✓
        </div>

        <h1>
          Password Updated
        </h1>

        <p class="forgot-description">
          Your password has been changed successfully.
          You can now login using your new password.
        </p>

        <a
          href="business-login.html"
          class="submit-button"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            text-decoration:none;
          "
        >
          Login Now
        </a>

      </div>

    </section>

  </main>


  <script src="assets/js/config.js"></script>
  <script src="assets/js/state.js"></script>
  <script src="assets/js/cache.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>


  <script>

    (function () {

      "use strict";


      const App =
        window.UBnux ||
        window.ZilaBiz ||
        {};


      let recoveryToken =
        "";


      let recoveryIdentifier =
        "";


      function text(value) {

        return String(
          value == null
            ? ""
            : value
        ).trim();

      }


      function showMessage(
        message,
        type
      ) {

        const box =
          document.getElementById(
            "message"
          );


        box.textContent =
          text(message);


        box.className =
          "message show " +
          (
            type === "success"
              ? "success"
              : "error"
          );

      }


      function setButtonLoading(
        button,
        loading,
        normalText,
        loadingText
      ) {

        button.disabled =
          loading;


        button.textContent =
          loading
            ? loadingText
            : normalText;

      }


      async function callAPI(
        action,
        payload
      ) {

        if (
          !App.api ||
          typeof App.api.call !==
            "function"
        ) {

          throw new Error(
            "API is not available."
          );

        }


        return await App.api.call(
          action,
          payload,
          {
            retries: 1
          }
        );

      }


      document
        .getElementById(
          "requestForm"
        )
        .addEventListener(
          "submit",
          async function (event) {

            event.preventDefault();


            const identifier =
              text(
                document.getElementById(
                  "identifier"
                ).value
              );


            if (!identifier) {

              showMessage(
                "Please enter your registered mobile number or email."
              );

              return;

            }


            const button =
              document.getElementById(
                "requestButton"
              );


            setButtonLoading(
              button,
              true,
              "Send Verification Code",
              "Sending..."
            );


            try {

              const response =
                await callAPI(
                  "businessforgotpassword",
                  {
                    identifier:
                      identifier
                  }
                );


              if (
                !response ||
                !response.success
              ) {

                throw new Error(
                  response &&
                  response.message
                    ? response.message
                    : "Unable to send verification code."
                );

              }


              recoveryIdentifier =
                identifier;


              recoveryToken =
                text(
                  response.token ||
                  (
                    response.data &&
                    response.data.token
                  )
                );


              showMessage(
                response.message ||
                "Verification code sent successfully.",
                "success"
              );


              document
                .getElementById(
                  "verificationSection"
                )
                .classList.add(
                  "show"
                );


              document
                .getElementById(
                  "otp"
                )
                .focus();


            } catch (error) {

              console.error(
                "Forgot password request error:",
                error
              );


              showMessage(
                error.message ||
                "Unable to process your request."
              );

            } finally {

              setButtonLoading(
                button,
                false,
                "Send Verification Code",
                "Sending..."
              );

            }

          }
        );


      document
        .getElementById(
          "verifyButton"
        )
        .addEventListener(
          "click",
          async function () {

            const otp =
              text(
                document.getElementById(
                  "otp"
                ).value
              );


            if (!otp) {

              showMessage(
                "Please enter the verification code."
              );

              return;

            }


            const button =
              document.getElementById(
                "verifyButton"
              );


            setButtonLoading(
              button,
              true,
              "Verify Code",
              "Verifying..."
            );


            try {

              const response =
                await callAPI(
                  "verifybusinessotp",
                  {
                    identifier:
                      recoveryIdentifier,

                    otp:
                      otp,

                    token:
                      recoveryToken
                  }
                );


              if (
                !response ||
                !response.success
              ) {

                throw new Error(
                  response &&
                  response.message
                    ? response.message
                    : "Invalid verification code."
                );

              }


              recoveryToken =
                text(
                  response.token ||
                  (
                    response.data &&
                    response.data.token
                  ) ||
                  recoveryToken
                );


              document
                .getElementById(
                  "passwordSection"
                )
                .classList.add(
                  "show"
                );


              document
                .getElementById(
                  "newPassword"
                )
                .focus();


              showMessage(
                "Verification successful. Please create a new password.",
                "success"
              );


            } catch (error) {

              console.error(
                "OTP verification error:",
                error
              );


              showMessage(
                error.message ||
                "Unable to verify the code."
              );

            } finally {

              setButtonLoading(
                button,
                false,
                "Verify Code",
                "Verifying..."
              );

            }

          }
        );


      document
        .getElementById(
          "resetButton"
        )
        .addEventListener(
          "click",
          async function () {

            const newPassword =
              document.getElementById(
                "newPassword"
              ).value;


            const confirmPassword =
              document.getElementById(
                "confirmPassword"
              ).value;


            if (
              newPassword.length < 6
            ) {

              showMessage(
                "New password must contain at least 6 characters."
              );

              return;

            }


            if (
              newPassword !==
              confirmPassword
            ) {

              showMessage(
                "Passwords do not match."
              );

              return;

            }


            const button =
              document.getElementById(
                "resetButton"
              );


            setButtonLoading(
              button,
              true,
              "Reset Password",
              "Updating..."
            );


            try {

              const response =
                await callAPI(
                  "resetbusinesspassword",
                  {
                    identifier:
                      recoveryIdentifier,

                    password:
                      newPassword,

                    token:
                      recoveryToken
                  }
                );


              if (
                !response ||
                !response.success
              ) {

                throw new Error(
                  response &&
                  response.message
                    ? response.message
                    : "Unable to reset password."
                );

              }


              document
                .getElementById(
                  "mainRecovery"
                )
                .style.display =
                "none";


              document
                .getElementById(
                  "successPanel"
                )
                .classList.add(
                  "show"
                );


            } catch (error) {

              console.error(
                "Password reset error:",
                error
              );


              showMessage(
                error.message ||
                "Unable to reset password."
              );

            } finally {

              setButtonLoading(
                button,
                false,
                "Reset Password",
                "Updating..."
              );

            }

          }
        );

    })();

  </script>

</body>

</html>
